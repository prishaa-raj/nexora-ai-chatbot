server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
 
    # SPA fallback -- let React Router / client-side routing handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
 
    # Proxy API calls to the backend container (see docker-compose.yml).
    # Adjust "backend" to match whatever hostname you deploy the API under
    # if you're not using the provided docker-compose setup.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
 
        # Without these, nginx defaults to a 60s timeout. The LLM provider
        # fallback chain (Groq -> Gemini -> OpenAI) plus a separate
        # classification call can occasionally take longer than that in
        # the worst case, causing nginx to drop the connection while the
        # backend keeps working and saves the real answer to MongoDB
        # anyway. Raising these avoids that mismatch.
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
